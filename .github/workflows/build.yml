name: Build Aurora Client JAR

on:
  push:
    branches:
      - 'claude/minecraft-fabric-jar-build-98iaka'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve Legacy Fabric versions
        run: |
          YARN=$(curl -sf "https://meta.legacyfabric.net/v2/versions/yarn/1.8.9" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['version'])")
          LOADER=$(curl -sf "https://meta.legacyfabric.net/v2/versions/loader/1.8.9" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['loader']['version'])")
          echo "Resolved yarn: $YARN  loader: $LOADER"
          sed -i "s/^yarn_mappings=.*/yarn_mappings=$YARN/" gradle.properties
          sed -i "s/^loader_version=.*/loader_version=$LOADER/" gradle.properties

      - name: Build with Gradle
        run: |
          ./gradlew build --no-daemon 2>&1 || {
            echo ""
            echo "=== BUILD FAILED — targeted yarn mappings diagnostic ==="
            MAPPINGS=$(find /home/runner/.gradle/caches/fabric-loom -name "mappings.tiny" 2>/dev/null | head -1)
            if [ -n "$MAPPINGS" ]; then
              echo "Mappings file: $MAPPINGS"
              # Determine obfuscated names from the 3-column flat tiny format
              MC_OBF=$(grep "MinecraftClient$" "$MAPPINGS" | awk '{print $2}' | head -1)
              SC_OBF=$(grep "/screen/Screen$" "$MAPPINGS" | awk '{print $2}' | head -1)
              echo "MinecraftClient official name: $MC_OBF"
              echo "Screen official name: $SC_OBF"
              echo ""
              echo "=== ALL MinecraftClient (${MC_OBF}) methods ==="
              grep "^METHOD	${MC_OBF}	" "$MAPPINGS"
              echo ""
              echo "=== MinecraftClient methods that take Screen (${SC_OBF}) ==="
              grep "^METHOD	${MC_OBF}	.*L${SC_OBF};" "$MAPPINGS"
            else
              echo "mappings.tiny not found in fabric-loom cache"
              find /home/runner/.gradle/caches/fabric-loom -type f 2>/dev/null | head -30
            fi
            exit 1
          }

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurora-client-jar
          path: build/libs/aurora-client-*.jar
          if-no-files-found: error
