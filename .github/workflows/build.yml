name: Build Aurora Client JAR

on:
  push:
    branches:
      - 'claude/minecraft-fabric-jar-build-98iaka'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve Legacy Fabric versions
        run: |
          YARN=$(curl -sf "https://meta.legacyfabric.net/v2/versions/yarn/1.8.9" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['version'])")
          LOADER=$(curl -sf "https://meta.legacyfabric.net/v2/versions/loader/1.8.9" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['loader']['version'])")
          echo "Resolved yarn: $YARN  loader: $LOADER"
          sed -i "s/^yarn_mappings=.*/yarn_mappings=$YARN/" gradle.properties
          sed -i "s/^loader_version=.*/loader_version=$LOADER/" gradle.properties

      - name: Build with Gradle
        run: ./gradlew build --no-daemon 2>&1

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurora-client-jar
          path: build/libs/aurora-client-*.jar
          if-no-files-found: error
